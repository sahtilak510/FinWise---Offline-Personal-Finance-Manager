<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Finwise Premium Chatbot Widget Fragment — include via th:replace -->
<div th:fragment="chatbotWidget">
    <!-- Floating Button -->
    <button id="fwChatFab" class="fw-chatbot-fab" type="button"
            aria-label="Open Finwise Assistant" data-i18n-aria-label="openAssistant" aria-expanded="false" aria-controls="fwChatPanel" title="Finwise Assistant — offline" data-i18n-title="fabTitle">
        <span class="fw-chatbot-fab-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M2 12h20"/></svg></span>
        <span class="fw-chatbot-fab-close" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M2 12h20"/></svg></span>
        <span class="fw-chatbot-fab-badge" id="fwChatBadge" aria-hidden="true">1</span>
    </button>

    <!-- Backdrop -->
    <div id="fwChatBackdrop" class="fw-chatbot-backdrop" aria-hidden="true"></div>

    <!-- Panel -->
    <section id="fwChatPanel" class="fw-chatbot-panel" role="dialog"
             aria-modal="true" aria-hidden="true" aria-labelledby="fwChatTitle">
        <header class="fw-chatbot-header">
            <div class="fw-chatbot-avatar-bot" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M2 12h20"/></svg></div>
            <div class="fw-chatbot-header-text">
                <div id="fwChatTitle" class="fw-chatbot-title" data-i18n="chatTitle">Offline Finance AI</div>
                <div class="fw-chatbot-subtitle"><span class="fw-chatbot-subtitle-dot" aria-hidden="true"></span><span data-i18n="chatSubtitle">Offline · Local SQL · No internet</span></div>
            </div>
            <div class="fw-chatbot-header-actions">
                <button id="fwChatMin" class="fw-chatbot-icon-btn" type="button" title="Minimize" data-i18n-title="minimize" aria-label="Minimize chat" data-i18n-aria-label="minimizeChat">—</button>
                <button id="fwChatClear" class="fw-chatbot-icon-btn danger" type="button" title="Clear chat" data-i18n-title="clearChatTitle" aria-label="Clear chat history" data-i18n-aria-label="clearHistoryTitle"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M2 12h20"/></svg>️</button>
                <button id="fwChatClose" class="fw-chatbot-icon-btn" type="button" title="Close" data-i18n-title="close" aria-label="Close chat" data-i18n-aria-label="closeChat"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M2 12h20"/></svg></button>
            </div>
        </header>

        <div id="fwChatLoading" class="fw-chatbot-loadingbar" aria-hidden="true"></div>

        <div id="fwChatChips" class="fw-chatbot-chips" role="toolbar" aria-label="Quick actions" data-i18n-aria-label="quickActions">
            <button class="fw-chatbot-chip" type="button" data-q="Analyze Expenses"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M2 12h20"/></svg><span data-i18n="analyzeExpenses">Analyze Expenses</span></button>
            <button class="fw-chatbot-chip" type="button" data-q="Show Balance"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M2 12h20"/></svg><span data-i18n="showBalance">Show Balance</span></button>
            <button class="fw-chatbot-chip" type="button" data-q="Budget Summary"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M2 12h20"/></svg><span data-i18n="budgetSummary">Budget Summary</span></button>
            <button class="fw-chatbot-chip" type="button" data-q="How much did I spend this month?" data-i18n="thisMonthSpend">This Month Spend</button>
            <button class="fw-chatbot-chip" type="button" data-q="What is my monthly income?" data-i18n="monthlyIncome">Monthly Income</button>
        </div>

        <div id="fwChatMessages" class="fw-chatbot-messages" role="log" aria-live="polite" aria-relevant="additions">
            <!-- Chart container for real-time data -->
            <div id="fwChatChartContainer" style="display:none; padding:8px 0;">
                <div style="background:rgba(255,255,255,.03); border:1px solid rgba(99,102,241,.15); border-radius:12px; padding:10px;">
                    <div style="font-size:12px; font-weight:600; color:var(--surface-200); margin-bottom:8px;">Financial Chart</div>
                    <canvas id="fwChatCanvas" style="width:100%; height:220px;"></canvas>
                </div>
            </div>
            <!-- Empty state -->
            <div id="fwChatEmpty" class="fw-chatbot-empty">
                <div class="fw-chatbot-empty-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M2 12h20"/></svg></div>
                <h4 data-i18n="chatWelcome">Hi, I'm your Finwise assistant</h4>
                <p data-i18n="chatEmptyNote">100% offline. I read only your local database — no internet, no cloud, no LLMs.</p>
                <div id="fwChatEmptyChips" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
                    <button class="fw-chatbot-chip" type="button" data-q="Analyze Expenses" data-i18n="analyzeExpenses">Analyze Expenses</button>
                    <button class="fw-chatbot-chip" type="button" data-q="Show Balance" data-i18n="showBalance">Show Balance</button>
                    <button class="fw-chatbot-chip" type="button" data-q="Budget Summary" data-i18n="budgetSummary">Budget Summary</button>
                </div>
            </div>
            <!-- System welcome will be hidden after history loads -->
            <div class="fw-chatbot-msg-row system" style="display:none;" id="fwChatWelcome">
                <div style="flex:1;"><div class="fw-chatbot-msg-bubble" data-i18n="chatWelcomeSys">Welcome! Ask about your finances — all answers from your local DB.</div></div>
            </div>
        </div>

        <div class="fw-chatbot-inputbar">
            <div class="fw-chatbot-inputwrap">
                <label for="fwChatInput" class="sr-only" style="position:absolute;left:-9999px;" data-i18n="messageLabel">Message</label>
                <textarea id="fwChatInput" class="fw-chatbot-input" rows="1" maxlength="500"
                          placeholder="Ask about your finances…" data-i18n-placeholder="chatPlaceholder" autocomplete="off"
                          aria-label="Type your question" data-i18n-aria-label="typeQuestion"></textarea>
                <span id="fwChatChar" class="fw-chatbot-char" aria-hidden="true">0/500</span>
            </div>
            <button id="fwChatSend" class="fw-chatbot-send" type="button" aria-label="Send message" data-i18n-aria-label="send"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M2 12h20"/></svg></button>
        </div>
    </section>
</div>
    <script src="/vendor/chart.js/chart.umd.min.js"></script>
    <script src="/js/chatbot-widget.js"></script>
</body>
</html>
