<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Reset Password — FinWise</title>
  <link rel="stylesheet" href="/css/3d-dynamic.css">
  <link rel="stylesheet" href="/css/finwise-tokens.css">
  <link rel="stylesheet" href="/css/finwise-layout.css">
  <link rel="stylesheet" href="/css/finwise-components.css">
  <link rel="stylesheet" href="/css/finwise-responsive.css">
  <link rel="stylesheet" href="/css/finwise-bridge.css">
  <link rel="stylesheet" href="/css/finwise-theme.css">
  <style>
    .reset-wrap { width: min(460px, calc(100% - 32px)); margin: 8vh auto; }
    .reset-card { padding: 28px; }
    .reset-card h1 { margin: 0 0 8px; }
    .reset-card p { margin: 0 0 20px; color: var(--fw-text-2); }
    .reset-field { margin-bottom: 16px; }
    .reset-field label { display: block; margin-bottom: 6px; }
    .reset-field-control { display: flex; gap: 8px; }
    .reset-field-control input { min-width: 0; flex: 1; }
    .reset-submit { width: 100%; }
    .reset-alert { margin-bottom: 16px; }
  </style>
</head>
<body class="fw-body">
<main class="reset-wrap">
  <section class="fw-card reset-card">
    <h1>Choose a new password</h1>
    <p>Set a new password for your FinWise account. This reset link expires after 30 minutes and can be used once.</p>
    <div th:if="${errorMessage}" class="fw-alert bad reset-alert" role="alert" th:text="${errorMessage}"></div>
    <form method="post" th:action="@{/reset-password}">
      <input type="hidden" name="userId" th:value="${userId}">
      <input type="hidden" name="token" th:value="${token}">
      <div class="reset-field">
        <label for="newPassword">New password</label>
        <div class="reset-field-control">
          <input class="fw-input" id="newPassword" name="newPassword" type="password"
                 minlength="6" autocomplete="new-password" required>
          <button class="fw-btn fw-btn-sec" type="button" data-password-toggle="newPassword">Show</button>
        </div>
      </div>
      <div class="reset-field">
        <label for="confirmPassword">Confirm new password</label>
        <div class="reset-field-control">
          <input class="fw-input" id="confirmPassword" name="confirmPassword" type="password"
                 minlength="6" autocomplete="new-password" required>
          <button class="fw-btn fw-btn-sec" type="button" data-password-toggle="confirmPassword">Show</button>
        </div>
      </div>
      <button class="fw-btn fw-btn-pri reset-submit" type="submit">Save new password</button>
    </form>
  </section>
</main>
<script>
  document.querySelectorAll('[data-password-toggle]').forEach(function (button) {
    var input = document.getElementById(button.dataset.passwordToggle);
    button.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      button.textContent = show ? 'Hide' : 'Show';
      button.setAttribute('aria-label', (show ? 'Hide' : 'Show') + ' password');
    });
  });
</script>
</body>
</html>
