<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    /* Early theme paint (no-FOUC). Server pref arrives later via fwScripts;
       until then follow saved choice, else Light. data-theme is Light|Dark. */
    (function () {
      try {
        var pref = localStorage.getItem('finwise_theme') || 'light';
        if (pref !== 'light' && pref !== 'dark') pref = 'light';
        var eff = pref;

        document.documentElement.setAttribute('data-theme', eff);
        if (document.documentElement.classList) {
          document.documentElement.classList.toggle('dark', eff === 'dark');
          document.documentElement.classList.toggle('light', eff === 'light');
        }
        try { document.documentElement.style.colorScheme = eff; } catch (e) {}
        try {
          var __ts = localStorage.getItem('finwise_textsize') || 'default';
          document.documentElement.setAttribute('data-fw-textsize', __ts);
          if (localStorage.getItem('finwise_contrast') === 'on') document.documentElement.classList.add('fw-high-contrast');
          if (localStorage.getItem('finwise_motion') === 'off') document.documentElement.classList.add('fw-no-motion');
        } catch (e2) {}
      } catch (e) {}
    })();
  </script>
    <title>Add Expense - Finwise</title>
    <link rel="stylesheet" href="/css/3d-dynamic.css">
  <link rel="stylesheet" href="/css/finwise-tokens.css">
  <link rel="stylesheet" href="/css/finwise-layout.css">
  <link rel="stylesheet" href="/css/finwise-components.css">
  <link rel="stylesheet" href="/css/finwise-responsive.css">
  <link rel="stylesheet" href="/css/chatbot-widget.css">
  <link rel="stylesheet" href="/css/finwise-bridge.css">
  <link rel="stylesheet" href="/css/finwise-theme.css">
</head>
<body class="fw-body fw-shell">
    <div th:replace="~{fragments/finwise :: fwSidebar('expenses', ${user})}"></div>
    <div th:replace="~{fragments/finwise :: fwTopbar('Expenses', null, ${user}, ${unreadCount})}"></div>
<div class="fw-scrim" onclick="fwCloseSidebar()"></div>

    <div class="fw-content"><main class="fw-wrap" id="main">
        <div class="fw-form-wrapper">
            <div class="fw-form-card fw-animate">
                <div class="fw-form-header">
                    <div class="fw-form-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M2 12h20"/></svg></div>
                    <h1>Add New Expense</h1>
                    <p>Record your spending instantly</p>
                </div>

                <form method="POST" th:action="@{/expenses/add}" enctype="multipart/form-data">
                    <div class="fw-form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" name="description" placeholder="What was this expense for?" required class="fw-form-input">
                    </div>
                    <div class="fw-form-row">
                        <div class="fw-form-group">
                            <label for="amount">Amount ($)</label>
                            <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="0.00" required class="fw-form-input">
                        </div>
                        <div class="fw-form-group">
                            <label for="expenseDate">Date</label>
                            <input type="date" id="expenseDate" name="expenseDate" required class="fw-form-input">
                        </div>
                    </div>
                    <div class="fw-form-row">
                        <div class="fw-form-group">
                            <label for="category">Category</label>
                            <select id="category" name="category" required class="fw-form-input">
                                <option value="">Select category</option>
                                <option value="Food">Food & Dining</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Education">Education</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="fw-form-group">
                            <label for="paymentMethod">Payment Method</label>
                            <input type="text" id="paymentMethod" name="paymentMethod" placeholder="Cash, Card, etc." class="fw-form-input">
                        </div>
                    </div>
                    <div class="fw-form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="3" placeholder="Add any additional notes..." class="fw-form-input"></textarea>
                    </div>
                    <div class="fw-form-row">
                        <div class="fw-form-group">
                            <label for="recurring">Recurring expense</label>
                            <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="recurring" name="recurring" value="true"> Repeat this expense</label>
                        </div>
                        <div class="fw-form-group">
                            <label for="recurrenceFrequency">Frequency</label>
                            <select id="recurrenceFrequency" name="recurrenceFrequency" class="fw-form-input">
                                <option value="MONTHLY">Monthly</option>
                                <option value="WEEKLY">Weekly</option>
                                <option value="QUARTERLY">Quarterly</option>
                                <option value="YEARLY">Yearly</option>
                                <option value="DAILY">Daily</option>
                            </select>
                        </div>
                    </div>
                    <div class="fw-form-group">
                        <label for="receipt">Receipt image</label>
                        <input type="file" id="receipt" name="receipt" accept="image/png,image/jpeg" class="fw-form-input">
                    </div>
                    <div class="fw-btn-group">
                        <button type="submit" class="fw-btn fw-btn-primary fw-btn-full"> Add Expense</button>
                        <a href="/expenses" class="fw-btn fw-btn-secondary fw-btn-full">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main></div>

    <div th:replace="~{fragments/finwise :: fwFooter}"></div>

    <div th:replace="~{fragments/finwise :: fwScripts}"></div>
</body>
</html>
