# Spring Boot Application Configuration

# Application name and port
spring.application.name=offline-finance-manager
server.port=8080
server.servlet.context-path=/

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:data/finance.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SQLite DDL Auto (create tables if not exists)
spring.jpa.defer-datasource-initialization=true

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/,classpath:/META-INF/resources/webjars/

# Scan & Fill uploads (local only, never exposed publicly)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123

# Application-specific properties
app.name=Finance Manager
app.version=1.0.0
app.data-dir=data/
app.workbook-path=data/Finwise_Data.xlsx
app.import-image-dir=data/import-images
app.tessdata-dir=data/tessdata
app.backup.enabled=true
app.backup.cron=0 0 2 * * *

# Logging
logging.level.root=INFO
logging.level.com.finance=DEBUG
logging.file.name=logs/finance.log
